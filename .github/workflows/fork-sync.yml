name: Fork sync

# Rebuilds this fork on upstream Plozz with fork/sync.sh: mirrors main and the
# release tags, rebases `patched`, and tags the newest release with the fork's
# commits on top. Runs only once the repository variable FORK_SYNC_ENABLED is
# "true" and the secret FORK_SYNC_DEPLOY_KEY holds a write deploy key; the
# default token cannot push upstream's workflow changes.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.FORK_SYNC_ENABLED == 'true'
    # `swift package resolve` needs Swift 6.1 or later; no simulator is used.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: patched
          fetch-depth: 0
          ssh-key: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}
      - name: Rebuild the fork on upstream
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          fork/sync.sh
